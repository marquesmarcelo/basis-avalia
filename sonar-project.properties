sonar.projectKey=basis-avalia
sonar.projectName=basis-avalia
sonar.projectVersion=0.1

# Backend (Go) e Frontend (Next.js/TypeScript) no mesmo projeto Sonar —
# módulos separados por caminho de fonte.
sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=**/node_modules/**,**/.next/**,**/tmp/**,**/dist/**,**/migrations/**,**/*.min.js

# Go
sonar.go.coverage.reportPaths=backend/coverage.out

# TypeScript/JavaScript
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Quality Gate mínimo (ver CLAUDE.md): cobertura >= 80%, sem Critical/Blocker novo.
