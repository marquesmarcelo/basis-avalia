root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/api"
bin = "tmp/server"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "testdata"]
delay = 1000
# send_interrupt + kill_delay: sem isto, um rebuild deixou o processo
# antigo vivo e ainda escutando :3001 enquanto o novo falhava com "address
# already in use" — toda mudança de código ficava invisível até reiniciar
# o container à mão (achado real: relatório de desempenho servindo 404 de
# uma build de horas atrás). SIGINT dá ao processo antigo a chance de
# liberar a porta antes do SIGKILL que vem depois do kill_delay.
send_interrupt = true
kill_delay = "2s"

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
