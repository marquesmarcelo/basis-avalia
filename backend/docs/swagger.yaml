basePath: /
definitions:
  http.AdministradorAtualizarRequest:
    properties:
      email:
        type: string
      nome:
        type: string
      versao:
        type: integer
    type: object
  http.AdministradorRequest:
    properties:
      email:
        type: string
      nome:
        type: string
      senha:
        type: string
    type: object
  http.AlterarSenhaRequest:
    properties:
      senha_atual:
        type: string
      senha_nova:
        type: string
    type: object
  http.AnexoResponse:
    properties:
      criado_em:
        type: string
      hash_sha256:
        type: string
      id:
        type: string
      nome_original:
        type: string
      tamanho_bytes:
        type: integer
      tipo:
        type: string
    type: object
  http.AprovacaoResponse:
    properties:
      data:
        type: string
      orgao:
        type: string
    type: object
  http.CandidatoResponse:
    properties:
      email:
        type: string
      id:
        type: string
      nome:
        type: string
      perfis:
        items:
          type: string
        type: array
    type: object
  http.ContextoDeSessaoResponse:
    properties:
      cursos_coordenados:
        type: integer
      email:
        type: string
      id:
        type: string
      instituicao:
        $ref: '#/definitions/http.InstituicaoResumoResponse'
      nome:
        type: string
      perfis:
        items:
          type: string
        type: array
      perfis_derivados:
        items:
          type: string
        type: array
      perfis_rotulos:
        items:
          type: string
        type: array
      permissoes:
        items:
          type: string
        type: array
      senha_provisoria:
        type: boolean
    type: object
  http.CoordenadorDaDesignacaoResponse:
    properties:
      id:
        type: string
      nome:
        type: string
    type: object
  http.CoordenadorDoCursoResponse:
    properties:
      data_fim:
        type: string
      id:
        type: string
      nome:
        type: string
      tambem_pesquisador_institucional:
        type: boolean
    type: object
  http.CopiaEmLoteResponse:
    properties:
      criados:
        type: integer
      pulados:
        items:
          $ref: '#/definitions/http.CursoPuladoResponse'
        type: array
    type: object
  http.CursoEmbutidoResponse:
    properties:
      codigo_emec:
        type: string
      grau:
        type: string
      id:
        type: string
      modalidade:
        type: string
      nome:
        type: string
      vago:
        type: boolean
    type: object
  http.CursoPuladoResponse:
    properties:
      curso:
        $ref: '#/definitions/http.CursoEmbutidoResponse'
      motivo:
        type: string
    type: object
  http.CursoResponse:
    properties:
      atualizado_em:
        type: string
      codigo_emec:
        type: string
      coordenador:
        $ref: '#/definitions/http.CoordenadorDoCursoResponse'
      criado_em:
        type: string
      grau:
        type: string
      id:
        type: string
      modalidade:
        type: string
      nome:
        type: string
      plano_do_periodo:
        description: |-
          PlanoDoPeriodo — só preenchido em GET /cursos (T-115); nil nas
          respostas de curso único (design.md §5.5: campo de grid, não de
          recurso individual).
        type: string
      situacao:
        type: string
      tem_vinculo:
        type: boolean
      versao:
        type: integer
    type: object
  http.DesignacaoResponse:
    properties:
      autodesignacao:
        type: boolean
      coordenador:
        $ref: '#/definitions/http.CoordenadorDaDesignacaoResponse'
      data_fim:
        type: string
      data_inicio:
        type: string
      id:
        type: string
      outras_designacoes_vigentes:
        type: integer
      portaria:
        type: string
      situacao:
        type: string
      versao:
        type: integer
    type: object
  http.DestinoDeCopiaResponse:
    properties:
      coordenador_nome:
        type: string
      curso_id:
        type: string
      curso_nome:
        type: string
      ja_tem_plano:
        type: boolean
      vago:
        type: boolean
    type: object
  http.EntregaResponse:
    properties:
      anexos:
        items:
          $ref: '#/definitions/http.AnexoResponse'
        type: array
      avaliada_em:
        type: string
      avaliada_por_nome:
        type: string
      avaliador_era_coordenador:
        type: boolean
      coordenado_pelo_avaliador:
        type: boolean
      corrigida_por_nome:
        type: string
      criado_em:
        type: string
      curso_id:
        type: string
      curso_nome:
        type: string
      enviada_por_id:
        type: string
      enviada_por_nome:
        type: string
      id:
        type: string
      indicadores:
        items:
          $ref: '#/definitions/http.IndicadorEmbutidoResponse'
        type: array
      item_plano_id:
        type: string
      meta_nome:
        type: string
      motivo:
        type: string
      observacao:
        type: string
      pendencia_vista_em:
        type: string
      prazo_correcao_ate:
        type: string
      quantidade:
        type: integer
      rodadas:
        type: integer
      situacao:
        type: string
      versao:
        type: integer
    type: object
  http.GrupoMinhasMetasResponse:
    properties:
      curso_id:
        type: string
      curso_nome:
        type: string
      itens:
        items:
          $ref: '#/definitions/http.ItemMinhasMetasResponse'
        type: array
    type: object
  http.IndicadorEmbutidoResponse:
    properties:
      codigo:
        type: string
      escopo:
        type: string
      id:
        type: string
      nome:
        type: string
      referencia_instrumento:
        type: string
      situacao:
        type: string
    type: object
  http.IndicadorPlataformaResponse:
    properties:
      atualizado_em:
        type: string
      codigo:
        type: string
      criado_em:
        type: string
      descricao:
        type: string
      escopo:
        type: string
      id:
        type: string
      metas:
        type: integer
      nome:
        type: string
      referencia_instrumento:
        type: string
      situacao:
        type: string
      versao:
        type: integer
    type: object
  http.IndicadorResponse:
    properties:
      atualizado_em:
        type: string
      codigo:
        type: string
      criado_em:
        type: string
      descricao:
        type: string
      escopo:
        type: string
      id:
        type: string
      metas:
        type: integer
      nome:
        type: string
      referencia_instrumento:
        type: string
      situacao:
        type: string
      versao:
        type: integer
    type: object
  http.IndicadorSugestaoResponse:
    properties:
      codigo:
        type: string
      escopo:
        type: string
      id:
        type: string
      nome:
        type: string
      referencia_instrumento:
        type: string
    type: object
  http.InstituicaoPublicaResponse:
    properties:
      id:
        type: string
      nome:
        type: string
      sigla:
        type: string
    type: object
  http.InstituicaoResponse:
    properties:
      atualizado_em:
        type: string
      codigo_emec:
        type: string
      criado_em:
        type: string
      id:
        type: string
      nome:
        type: string
      pesquisadores_ativos:
        type: integer
      sigla:
        type: string
      situacao:
        type: string
      versao:
        type: integer
    type: object
  http.InstituicaoResumoResponse:
    properties:
      id:
        type: string
      nome:
        type: string
      sigla:
        type: string
    type: object
  http.ItemMinhasMetasResponse:
    properties:
      aceitas:
        type: integer
      em_correcao:
        type: integer
      indicadores:
        items:
          $ref: '#/definitions/http.IndicadorEmbutidoResponse'
        type: array
      item_plano_id:
        type: string
      meta_nome:
        type: string
      pendentes:
        type: integer
      quantidade:
        type: integer
    type: object
  http.ItemPlanoResponse:
    properties:
      id:
        type: string
      indicadores:
        items:
          $ref: '#/definitions/http.IndicadorEmbutidoResponse'
        type: array
      meta_id:
        type: string
      meta_nome:
        type: string
      quantidade:
        type: integer
      tem_entrega:
        type: boolean
      versao:
        type: integer
    type: object
  http.LoginRequest:
    properties:
      email:
        type: string
      instituicao_id:
        type: string
      senha:
        type: string
    type: object
  http.MetaResponse:
    properties:
      atualizado_em:
        type: string
      criado_em:
        type: string
      descricao:
        type: string
      id:
        type: string
      indicadores:
        items:
          $ref: '#/definitions/http.IndicadorEmbutidoResponse'
        type: array
      nome:
        type: string
      planos:
        type: integer
      quantidade_sugerida:
        type: integer
      situacao:
        type: string
      versao:
        type: integer
    type: object
  http.MetaSugestaoResponse:
    properties:
      id:
        type: string
      indicadores:
        items:
          $ref: '#/definitions/http.IndicadorEmbutidoResponse'
        type: array
      nome:
        type: string
      quantidade_sugerida:
        type: integer
    type: object
  http.PendenciasResponse:
    properties:
      pendencias_nao_vistas:
        type: integer
      pendentes_de_avaliacao:
        type: integer
    type: object
  http.PeriodoEmbutidoResponse:
    properties:
      id:
        type: string
      nome:
        type: string
    type: object
  http.PeriodoOpcaoResponse:
    properties:
      aberto:
        type: boolean
      data_fim:
        type: string
      id:
        type: string
      nome:
        type: string
    type: object
  http.PeriodoResponse:
    properties:
      atualizado_em:
        type: string
      criado_em:
        type: string
      data_fim:
        type: string
      data_inicio:
        type: string
      id:
        type: string
      nome:
        type: string
      planos:
        type: integer
      situacao:
        type: string
      versao:
        type: integer
    type: object
  http.PesquisadorAtualizarRequest:
    properties:
      email:
        type: string
      nome:
        type: string
      versao:
        type: integer
    type: object
  http.PesquisadorRequest:
    properties:
      email:
        type: string
      nome:
        type: string
      senha:
        type: string
    type: object
  http.PlanoResponse:
    properties:
      alinhamento_pdi:
        type: string
      alinhamento_ppc:
        type: string
      aprovacao:
        $ref: '#/definitions/http.AprovacaoResponse'
      atualizado_em:
        type: string
      coordenador_nome:
        type: string
      criado_em:
        type: string
      curso:
        $ref: '#/definitions/http.CursoEmbutidoResponse'
      descricao:
        type: string
      encerramento_motivo:
        type: string
      id:
        type: string
      itens:
        items:
          $ref: '#/definitions/http.ItemPlanoResponse'
        type: array
      metas:
        type: integer
      objetivo_geral:
        type: string
      periodo:
        $ref: '#/definitions/http.PeriodoEmbutidoResponse'
      resultados_esperados:
        type: string
      sem_aprovacao:
        type: boolean
      situacao:
        type: string
      tem_entrega:
        type: boolean
      total_exigido:
        type: integer
      ultimo_documento:
        $ref: '#/definitions/http.UltimoDocumentoResponse'
      versao:
        type: integer
    type: object
  http.RedefinirSenhaRequest:
    properties:
      senha_nova:
        type: string
    type: object
  http.UltimoDocumentoResponse:
    properties:
      gerado_em:
        type: string
      id:
        type: string
    type: object
  http.UsuarioAtualizarRequest:
    properties:
      email:
        type: string
      nome:
        type: string
      perfis:
        items:
          type: string
        type: array
      versao:
        type: integer
    type: object
  http.UsuarioRequest:
    properties:
      email:
        type: string
      nome:
        type: string
      perfis:
        items:
          type: string
        type: array
      senha:
        type: string
    type: object
  http.UsuarioResponse:
    properties:
      atualizado_em:
        type: string
      criado_em:
        type: string
      email:
        type: string
      id:
        type: string
      nome:
        type: string
      perfis:
        items:
          type: string
        type: array
      perfis_rotulos:
        items:
          type: string
        type: array
      senha_provisoria:
        type: boolean
      versao:
        type: integer
    type: object
  http.VersaoResponse:
    properties:
      versao:
        type: string
    type: object
  http.erroResposta:
    properties:
      campo:
        type: string
      code:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: Autenticação, instituições e usuários com múltiplos perfis.
  title: basis-avalia API
  version: "1.0"
paths:
  /api/v1/administradores:
    get:
      description: 'Cada rota lista um universo diferente: usuários da própria instituição
        de quem chama, pesquisadores institucionais de uma instituição específica,
        ou administradores da plataforma.'
      parameters:
      - description: busca por nome ou e-mail
        in: query
        name: busca
        type: string
      - description: filtra por posse do perfil — só na rota de usuários
        in: query
        name: perfil
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: PARAMETRO_INVALIDO
          schema:
            $ref: '#/definitions/http.erroResposta'
        "401":
          description: SESSAO_EXPIRADA, CONTA_EXCLUIDA ou INSTITUICAO_INATIVA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "403":
          description: PERMISSAO_NEGADA ou SENHA_PROVISORIA
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Listar usuários, pesquisadores institucionais ou administradores
      tags:
      - usuarios
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do novo administrador
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.AdministradorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.UsuarioResponse'
        "400":
          description: PAYLOAD_INVALIDO, SENHA_OBRIGATORIA ou SENHA_ACIMA_DO_LIMITE
          schema:
            $ref: '#/definitions/http.erroResposta'
        "401":
          description: SESSAO_EXPIRADA, CONTA_EXCLUIDA ou INSTITUICAO_INATIVA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "403":
          description: PERMISSAO_NEGADA ou SENHA_PROVISORIA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "409":
          description: EMAIL_DUPLICADO
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Criar administrador do sistema
      tags:
      - usuarios
  /api/v1/administradores/{usuario_id}:
    delete:
      description: Deleção lógica (excluido_em) — nunca DELETE real. Recusada se for
        o último Pesquisador Institucional ou o último Administrador do Sistema.
      parameters:
      - description: id da instituição — só na rota de pesquisadores
        in: path
        name: id
        type: string
      - description: id do usuário
        in: path
        name: usuario_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: SESSAO_EXPIRADA, CONTA_EXCLUIDA ou INSTITUICAO_INATIVA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "403":
          description: PERMISSAO_NEGADA, AUTO_EXCLUSAO_NEGADA ou SENHA_PROVISORIA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "404":
          description: NAO_ENCONTRADO
          schema:
            $ref: '#/definitions/http.erroResposta'
        "409":
          description: ULTIMO_PESQUISADOR_INSTITUCIONAL ou ULTIMO_ADMINISTRADOR_SISTEMA
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Excluir usuário, pesquisador institucional ou administrador
      tags:
      - usuarios
    get:
      parameters:
      - description: id da instituição — só na rota de pesquisadores
        in: path
        name: id
        type: string
      - description: id do usuário
        in: path
        name: usuario_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UsuarioResponse'
        "401":
          description: SESSAO_EXPIRADA, CONTA_EXCLUIDA ou INSTITUICAO_INATIVA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "403":
          description: PERMISSAO_NEGADA ou SENHA_PROVISORIA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "404":
          description: NAO_ENCONTRADO
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Buscar usuário, pesquisador institucional ou administrador por id
      tags:
      - usuarios
    put:
      consumes:
      - application/json
      description: 'Concorrência otimista via "versao": envie o valor recebido no
        GET mais recente.'
      parameters:
      - description: id do usuário
        in: path
        name: usuario_id
        required: true
        type: string
      - description: Dados atualizados
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.AdministradorAtualizarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UsuarioResponse'
        "400":
          description: PAYLOAD_INVALIDO
          schema:
            $ref: '#/definitions/http.erroResposta'
        "401":
          description: SESSAO_EXPIRADA, CONTA_EXCLUIDA ou INSTITUICAO_INATIVA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "403":
          description: PERMISSAO_NEGADA ou SENHA_PROVISORIA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "404":
          description: NAO_ENCONTRADO
          schema:
            $ref: '#/definitions/http.erroResposta'
        "409":
          description: CONFLITO_DE_VERSAO, EMAIL_DUPLICADO ou ULTIMO_ADMINISTRADOR_SISTEMA
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Atualizar administrador do sistema
      tags:
      - usuarios
  /api/v1/administradores/{usuario_id}/senha:
    post:
      consumes:
      - application/json
      description: A senha nasce provisória (troca obrigatória no próximo acesso).
        Redefinir a própria senha por este caminho é negado — use "Alterar minha senha".
      parameters:
      - description: id da instituição — só na rota de pesquisadores
        in: path
        name: id
        type: string
      - description: id do usuário
        in: path
        name: usuario_id
        required: true
        type: string
      - description: Nova senha provisória
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.RedefinirSenhaRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: PAYLOAD_INVALIDO, SENHA_OBRIGATORIA ou SENHA_ACIMA_DO_LIMITE
          schema:
            $ref: '#/definitions/http.erroResposta'
        "401":
          description: SESSAO_EXPIRADA, CONTA_EXCLUIDA ou INSTITUICAO_INATIVA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "403":
          description: PERMISSAO_NEGADA ou SENHA_PROVISORIA
          schema:
            $ref: '#/definitions/http.erroResposta'
        "404":
          description: NAO_ENCONTRADO
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Redefinir a senha de outro usuário
      tags:
      - usuarios
  /api/v1/anexos/{id}:
    delete:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.erroResposta'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.erroResposta'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Remover anexo de uma entrega
      tags:
      - anexos
  /api/v1/anexos/{id}/conteudo:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.erroResposta'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.erroResposta'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Baixar o conteúdo de um anexo
      tags:
      - anexos
  /api/v1/auth/eu:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ContextoDeSessaoResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Quem sou eu
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ContextoDeSessaoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.erroResposta'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.erroResposta'
      summary: Entrar
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      produces:
      - application/json
      responses:
